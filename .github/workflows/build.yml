name: Build & Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, master, ci-test ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: Install pywebview system libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev libcairo2-dev pkg-config \
            gir1.2-gtk-3.0 libgtk-3-dev \
            gir1.2-webkit2-4.1 libwebkit2gtk-4.1-dev

      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: metplot-build
          init-shell: bash
          cache-environment: true
          create-args: >-
            python=3.12
            xarray
            cfgrib
            eccodes
            python-eccodes
            netcdf4
            pandas
            cartopy
            numpy
            scipy
            matplotlib
            pillow
            beautifulsoup4
            httpx
            requests
            ffmpeg
            pytest
            setuptools<81

      - name: Install PyGObject (Linux)
        if: runner.os == 'Linux'
        run: micromamba install -y -n metplot-build -c conda-forge pygobject

      - name: Install MetPlot and GUI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pyinstaller nicegui pywebview==5.4 customtkinter opencv-python-headless

      - name: Ensure wgrib2 is executable (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ -f MetPlot/wgrib/wgrib2 ]; then
            chmod +x MetPlot/wgrib/wgrib2
          fi

      - name: Run unit tests
        run: python -m pytest tests

      - name: Verify GUI syntax
        run: |
          python -c "import py_compile; [py_compile.compile(f, doraise=True) for f in ('GUI/main.py', 'GUI/modeldownloads.py', 'GUI/plotting_backend.py')]"

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm main.spec

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetPlot-${{ matrix.os }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
